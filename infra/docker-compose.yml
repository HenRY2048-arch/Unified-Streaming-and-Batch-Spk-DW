# 内容社区实时数仓 —— 本地中间件（WSL2 / Docker Desktop）
# 说明：本文件只起"中间件"，生成器与 Spark 暂以 WSL2 本机进程运行。
# 依赖：apache/kafka:4.1.0（本机已有镜像，无需拉取）
# 启动：docker compose -f infra/docker-compose.yml up -d
name: crt

services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: crt-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"          # EXTERNAL：供 WSL2 宿主进程（生成器）使用
    environment:
      # ---- KRaft 单节点（免 ZooKeeper）----
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # ---- 双 listener：容器内 INTERNAL / 宿主 EXTERNAL ----
      KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:19092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      # ---- 单节点容错 ----
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_LOG_RETENTION_HOURS: "24"
      # ---- 限内存（WSL2 内存硬顶 ~7.58GB）----
      KAFKA_HEAP_OPTS: "-Xms512M -Xmx1G"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # ---- 对象存储：SeaweedFS（S3 网关）----
  # 说明：2026-10-16 实测 minio/minio 仓库在 Docker Hub 已消失（404）；改用 SeaweedFS（Apache-2.0）。
  #       S3 端点：容器内 http://seaweedfs:8333 ｜ 宿主 http://localhost:8333（**path-style**）
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: crt-s3
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"          # S3 API
      - "9333:9333"          # master
      - "8888:8888"          # filer / web
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    mem_limit: 768m

  # ---- Redis Stack：Tier0 服务缓存（**非真值**）----
  redis:
    image: redis/redis-stack-server:latest
    container_name: crt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      REDIS_ARGS: "--maxmemory 512mb --maxmemory-policy allkeys-lru"
    volumes:
      - redis-data:/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---- Spark 3.5.x（按需启动：docker compose --profile tools …）----
  # 版本配对：delta-spark_2.12 3.2.1 编译自 Spark 3.5.3（3.5.1 上的 MERGE 会 NoSuchMethodError）；
  #          换 Delta 版本时务必同步这两个版本号。
  spark:
    image: apache/spark:3.5.3
    container_name: crt-spark
    profiles: ["tools"]
    volumes:
      - ../RealTime:/opt/crt/RealTime     # 生成器工程（含 target/*.jar）
      - ./:/opt/crt/infra                 # compose / 配置
      - ../target:/opt/crt/warehouse:ro   # 数仓薄 jar（mvn package 产物）
    ports:
      - "4040:4040"                       # Spark UI
    mem_limit: 3g

  # ---- Mock Generator（按需启动；配置 profile 通过 CRT_GENERATOR_PROFILE 选择）----
  # 启动：CRT_GENERATOR_PROFILE=observation-normal docker compose --profile generator up -d generator
  # 停止：docker compose stop generator
  generator:
    image: crt-mock-generator:0.1.0
    build:
      context: ../RealTime
      dockerfile: Dockerfile
    container_name: crt-generator
    profiles: ["tools", "generator"]
    user: "0:0"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/java/openjdk/bin/java"]
    command:
      - "-Dconfig.file=/opt/crt/generator/config/${CRT_GENERATOR_PROFILE:-observation-normal}.properties"
      - "-Dmock.run.name=${CRT_RUN_NAME:-observation-run}"
      - "-Dmock.run.duration.seconds=${CRT_RUN_DURATION_SECONDS:-}"
      - "-Dmock.run.target.event.days=${CRT_TARGET_EVENT_DAYS:-}"
      - "-Dmock.run.max.events=${CRT_MAX_EVENTS:-}"
      - "-Dkafka.bootstrap.servers=kafka:19092"
      - "-jar"
      - "/opt/crt/generator/app.jar"
    volumes:
      - ../RealTime/data_files:/opt/crt/generator/data_files
      - ../RealTime/config:/opt/crt/generator/config:ro
    mem_limit: 1g

  # ---- 常驻流作业（Kafka→ODS→Tier0）----
  # 启动：CRT_STREAM_RESET=true docker compose --profile stream up -d stream
  # 停止：docker compose stop stream && docker compose rm -f stream
  stream:
    image: apache/spark:3.5.3
    container_name: crt-stream
    profiles: ["tools", "stream"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/crt/infra/scripts/stream_container.sh"]
    volumes:
      - ../RealTime:/opt/crt/RealTime
      - ./:/opt/crt/infra
      - ../target:/opt/crt/warehouse:ro
    mem_limit: 3g

volumes:
  kafka-data:
  seaweedfs-data:
  redis-data:
