# Mock Generator 配置（P1.0 外置）
# 覆盖方式：优先读 -Dconfig.file=/abs/path/to/xxx.properties；否则读本文件；再缺则用内置默认值。

# ---- Kafka ----
kafka.bootstrap.servers=localhost:9092
kafka.topic=content_events
kafka.acks=1

# ---- 输出目录（维表种子等；原硬编码为 /home/hyr/data_files）----
data.dir=data_files

# ---- Mock 规模 ----
# 用户/内容规模（P1.1 起：作者 ≡ 用户，内容有 author_id）
mock.user.count=1000
mock.item.initial.count=500
# 兴趣标签覆盖率（其余为冷启动）
mock.tag.coverage=0.8
# 创作者占比（作者 ≡ 用户）
mock.creator.ratio=0.15
# 社交图：平均出度 + 跨簇边占比（分群 + 簇内优先连接）
mock.graph.avg.outdegree=10
mock.graph.cross.cluster.ratio=0.08

# ---- 事件契约（P1.2）----
mock.schema.version=v2
# 一次推送的候选数量
mock.batch.size=8
# 是否发 exposure_batch 批次事件
mock.emit.exposure=true
# 批次候选是否带 rank_score
mock.batch.rank.score=true
# 作者产出（item_published）速率：每次迭代触发概率
mock.item.publish.rate=0.01
# 分发渠道基线权重（explore 为余量）
mock.channel.weight.recommend=0.45
mock.channel.weight.follow=0.35

# ---- 会话旅途（P1.3）----
# 会话最大步数
mock.session.max.steps=12
# 点击模型：位置 0 的点击概率、每后移一位的衰减、兴趣匹配加成
mock.click.base=0.55
mock.click.position.decay=0.55
mock.click.interest.boost=1.6
# 停留模型：基础秒数 + 内容长度/阅读速度（字符每秒）
mock.dwell.base.seconds=2.0
mock.dwell.chars.per.sec.min=45
mock.dwell.chars.per.sec.max=110
# 互动概率（每次消费）
mock.engage.like=0.06
mock.engage.fav=0.03
mock.engage.share=0.012
mock.engage.comment=0.006
mock.engage.dislike=0.010
# 关注/取关（每次消费；关注会真正改图）
mock.follow.prob=0.02
mock.unfollow.prob=0.004

# ---- 分发策略与成本（P1.4 / C4 / C5）----
# 策略：hybrid | random | interest | graph
mock.distribution.strategy=hybrid
# 分发成本档位：cheap | standard | heavy
mock.cost.tier=standard

# ---- 压力档位（P1.4 / C6 / E3）----
# 负载档位：steady | peak | ramp | skew
mock.load.tier=steady
mock.eps.steady.min=30
mock.eps.steady.max=50
mock.eps.peak.min=150
mock.eps.peak.max=200
mock.peak.interval.minutes=10
mock.peak.duration.seconds=30
mock.eps.ramp.start=30
mock.eps.ramp.end=200
mock.eps.ramp.minutes=10
mock.eps.skew.base.min=20
mock.eps.skew.base.max=40
mock.eps.skew.burst.min=300
mock.eps.skew.burst.max=600
mock.eps.skew.burst.prob=0.02

# ---- 归因真值（P1.4 / D2）----
mock.truth.topic=content_groundtruth

# ---- 运行计划（观测基线）----
# 名称只用于日志/清单；duration 是真实墙钟秒，target.event.days 是模拟事件天，
# max.events 是主事件条数。三者均为 0 表示持续运行，任一达到即优雅停止。
mock.run.name=default
mock.run.duration.seconds=0
mock.run.target.event.days=0
mock.run.max.events=0
mock.random.seed=20261028
mock.run.manifest.dir=data_files/run_manifest

# ---- 行为异常 / 乱序（chaos）----
mock.chaos.enabled=true
mock.chaos.a1.enabled=true
mock.chaos.a1.every.n=1000
mock.chaos.a1.count=5
mock.chaos.a1.spacing.seconds=1
mock.chaos.a2.enabled=true
mock.chaos.a2.every.n=1000
mock.chaos.a2.count=15
mock.chaos.a2.window.millis=5000
mock.chaos.d1.enabled=true
mock.chaos.d1.rate=0.15
mock.chaos.d1.min.seconds=0.2
mock.chaos.d1.max.seconds=1.2
mock.chaos.e1.enabled=true
mock.chaos.e1.rate=0.05
mock.chaos.e1.max.seconds=0.8
mock.chaos.extended.enabled=true
mock.chaos.extended.rate=0.005
mock.chaos.extended.min.seconds=1800
mock.chaos.extended.max.seconds=3600
mock.chaos.out_of_order.enabled=true
mock.chaos.out_of_order.rate=0.10
mock.chaos.out_of_order.min.seconds=30
mock.chaos.out_of_order.max.seconds=90

# ---- 数据缺陷 / 传输故障注入（默认关闭）----
mock.data_defect.enabled=false
mock.data_defect.rate=0
mock.data_defect.modes=invalid_json,missing_field,invalid_enum,wrong_type
mock.data_defect.duplicate.rate=0
mock.data_defect.drop.rate=0
mock.fault.pause.after.seconds=0
mock.fault.pause.duration.seconds=0

# ---- 模拟时钟（P1.6 / 契约 v2）----
# 时间推进分两段：会话内按"思考 + 停留"1:1 推进；会话之间推进一个"离线间隙"（跨天靠它）。
# 会话内"思考时间"（事件秒）
mock.clock.think.min.seconds=2
mock.clock.think.max.seconds=20
# 并发会话上限：限流后会话能在几个真实秒内走完，跨用户时间线偏差被压在分钟级（详见 SimClock 注释）
mock.session.max.open=30
# 模拟时钟落盘 + 重启续跑（true 时起点取 max(真实现在, 上次落盘值)，避免事件时间回退）
mock.clock.file=data_files/.sim_clock
mock.clock.resume=true

# ---- 新用户注入（P1.6 / 契约 v2）----
# 速率按 **事件时间** 计：每"事件天"注入多少人；0 = 关闭注入
mock.user.registered.per.day=30
# 注册 → 首次打开的间隔（事件分钟），决定 U-03 次留基线
mock.user.first.open.delay.min.minutes=0
mock.user.first.open.delay.max.minutes=180
# 注入用户 id 起始段（种子为 100001–101000）
mock.user.id.inject.base=300001
# 已注入用户落盘（append；重启靠它避免重复发 id）
mock.user.injected.file=data_files/dim_user_injected.csv
# 运行期关注图增删日志（重启恢复，不修改种子文件）
mock.graph.state.file=data_files/graph_state.log
# 状态型互动日志（like/dislike/fav 跨重启去重）
mock.interaction.state.file=data_files/interaction_state.log

# ---- 会话超时（事件时间）----
mock.session.timeout.minutes=30
# 已有会话的推进权重（越高越"深挖当前会话"；越低越"开新会话"，新用户/cohort 样本更厚）
mock.session.resume.weight=0.85
