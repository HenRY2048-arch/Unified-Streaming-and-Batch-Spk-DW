# 故障观测：正常行为上叠加少量坏数据、重复、丢弃和发送暂停，用于 Data Agent 诊断。
mock.run.name=observation-incidents
mock.run.duration.seconds=300
mock.run.target.event.days=2
mock.run.max.events=0
mock.load.tier=steady
mock.chaos.enabled=true
mock.chaos.out_of_order.rate=0.15
mock.data_defect.enabled=true
mock.data_defect.rate=0.03
mock.data_defect.modes=invalid_json,missing_field,invalid_enum,wrong_type
mock.data_defect.duplicate.rate=0.05
mock.data_defect.drop.rate=0.01
mock.fault.pause.after.seconds=45
mock.fault.pause.duration.seconds=8
