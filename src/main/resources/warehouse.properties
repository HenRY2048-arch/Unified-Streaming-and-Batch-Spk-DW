# 数仓（T 层）默认配置。
# 覆盖顺序：本文件 < -Dconfig.file=<绝对路径> < 任意 -Dkey=value（JVM 系统属性优先）。

warehouse.name=crt-warehouse

# ---- 存储 ----
lake.root=s3a://crt-lake
checkpoint.root=s3a://crt-lake/_checkpoint

# ---- S3A（SeaweedFS，path-style）----
fs.s3a.endpoint=http://seaweedfs:8333
fs.s3a.path.style.access=true
fs.s3a.connection.ssl.enabled=false
fs.s3a.access.key=crtadmin
fs.s3a.secret.key=crtadmin123
fs.s3a.endpoint.region=us-east-1
fs.s3a.multipart.size=16777216

# ---- Kafka ----
kafka.bootstrap.servers=kafka:19092
kafka.topic.events=content_events
kafka.topic.truth=content_groundtruth
kafka.starting.offsets=earliest
kafka.max.offsets.per.trigger=20000

# ---- Spark ----
spark.sql.shuffle.partitions=8
spark.sql.session.timeZone=Asia/Shanghai

# ---- Redis（Tier0 缓存，非真值）----
redis.host=redis
redis.port=6379
redis.key.prefix=crt:

# ---- Tier0 热度（F-07；权重见 Warehouse_Tables §7）----
heat.windows.minutes=60,1440
heat.w.exposure=0.1
heat.w.click=1
heat.w.like=3
heat.w.fav=4
heat.w.comment=6
heat.w.share=8
heat.dwell.factor=0.02
heat.dwell.cap.seconds=30
heat.top.n=200
online.window.minutes=15
redis.ttl.seconds=900

# ---- 批处理 ----
batch.recompute.days=2
# 生成器种子目录（Spark 容器内挂载点）
mock.data.dir=/opt/crt/RealTime/data_files

# ---- Gate v1（阈值/等待；见 Gate_Grading_Scheme.md §5/§8）----
gate.policy.version=gate-v1
gate.dr3.wait.minutes=5
gate.dr3.retries=3
gate.ql.tolerance.pp=3
gate.ql.degrade.pp=5
gate.ql.small.sample=200
gate.ql.rolling.days=7
gate.v02.rel.diff=1e-9
gate.rc.match.rate=0.99
gate.rc.recall=0.999

# ---- 维护 ----
vacuum.retention.hours=168
